# Minimal tmux configuration for iTerm and terminal-based agents.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g mouse on

# Keep names under operator control and reflect them in the terminal title.
setw -g allow-rename off
setw -g automatic-rename off
set -g set-titles on
set -g set-titles-string "#S:#W"

# With Caps Lock mapped to Control, Caps Lock+A is the prefix.
unbind C-b
set -g prefix C-a
bind-key a send-prefix

# Reload after editing the installed configuration.
bind-key C-r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# New windows and splits stay in the current working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Open or return to this tmux window's persistent Codex thread. The thread may
# remain unnamed; Codex /rename becomes its Muster slug whenever it is set.
bind-key C display-popup -C \; run-shell -b 'sleep 0.05; muster codex popup'
